[env:heltec_wifi_kit_32]
platform   = espressif32
board      = heltec_wifi_kit_32
framework  = arduino

monitor_speed   = 115200
upload_speed    = 921600

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9

build_flags =
    -DARDUINO_HELTEC_WIFI_KIT_32
    -DBOARD_HAS_PSRAM
